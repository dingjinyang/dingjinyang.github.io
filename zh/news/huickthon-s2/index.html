          构建。
        
      </p>
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          var desktopMedia = window.matchMedia("(min-width: 992px)");

          function dropdownParts(dropdown) {
            return {
              toggle: dropdown.querySelector(":scope > .nav-link"),
              menu: dropdown.querySelector(":scope > .dropdown-menu"),
            };
          }

          function setDropdownState(dropdown, open) {
            var parts = dropdownParts(dropdown);
            if (!parts.toggle || !parts.menu) return;

            dropdown.classList.toggle("show", open);
            parts.menu.classList.toggle("show", open);
            parts.toggle.setAttribute("aria-expanded", open ? "true" : "false");
          }

          function closeHeaderDropdowns(except) {
            document
              .querySelectorAll(".theme-dropdown, .i18n-dropdown")
              .forEach(function (dropdown) {
                if (dropdown !== except) {
                  setDropdownState(dropdown, false);
                }
              });
          }

          document
            .querySelectorAll(".theme-dropdown, .i18n-dropdown")
            .forEach(function (dropdown) {
              var parts = dropdownParts(dropdown);
              if (!parts.toggle || !parts.menu) return;

              parts.toggle.addEventListener("click", function (event) {
                event.preventDefault();
                event.stopPropagation();

                var willOpen = !dropdown.classList.contains("show");
                closeHeaderDropdowns(dropdown);
                setDropdownState(dropdown, willOpen);
              });

              dropdown.addEventListener("mouseenter", function () {
                if (!desktopMedia.matches) return;
                closeHeaderDropdowns(dropdown);
                setDropdownState(dropdown, true);
              });

              dropdown.addEventListener("mouseleave", function () {
                if (!desktopMedia.matches) return;
                setDropdownState(dropdown, false);
              });

              parts.menu.addEventListener("click", function (event) {
                event.stopPropagation();
              });
            });

          document.addEventListener("click", function () {
            closeHeaderDropdowns();
          });

          document
            .querySelectorAll(".i18n-dropdown span")
            .forEach(function (node) {
              if (node.textContent.trim() === "中文 (简体)") {
                node.textContent = "中文";
              }
            });

          if (document.documentElement.lang !== "zh-cn") return;

          document.querySelectorAll(".js-cite-modal").forEach(function (button) {
            var filename = button.getAttribute("data-filename");
            if (!filename) return;

            button.setAttribute(
              "data-filename",
              filename.replace(/^\/zh\/publication\//, "/publication/")
            );
          });
        });
      </script>
      <br />
    </footer>
  </div>
</div>
